name: Validate Streamlit COE dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'dashboard/**'
      - 'data/**'
      - 'logos/**'
      - '.streamlit/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/dashboard-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coe-dashboard-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install application requirements
        run: pip install -r requirements.txt
      - name: Check syntax, survey and cartographic layer
        run: |
          python -m py_compile app.py dashboard/data.py dashboard/charts.py dashboard/i18n.py
          python -m pytest -q tests/test_dashboard_data.py tests/test_dashboard_layout.py tests/test_dashboard_i18n.py tests/test_dashboard_map.py tests/test_dashboard_alignment.py
      - name: Smoke-test bilingual pages and regional charts
        run: |
          python - <<'PYTEST'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file('app.py').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          locale = next(x for x in app.radio if x.key == 'coe_language')
          assert locale.value == 'en', 'English must be the initial language'
          assert not any(x.key == 'geo_area' for x in app.selectbox)
          assert not any(x.key == 'country_filter' for x in app.multiselect)

          # Check regional charts in Spanish, then country view in Spanish.
          locale.set_value('es').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          section = next(x for x in app.segmented_control if x.key == 'regional_section')
          assert section.value == 'Overview', 'Regional overview must be initially selected'
          assert not any(x.key == 'regional_section' for x in app.sidebar.radio)
          section.set_value('Capacities & gaps').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          html = next(
              (x.value for x in app.markdown if '<details class="eoc-capacity-disclosure">' in x.value), ''
          )
          assert '<details class="eoc-capacity-disclosure">' in html, (
              'The interactive capacity rows were not rendered'
          )
          assert '<summary class="eoc-capacity-summary">' in html, (
              'The bar rows must be clickable summaries'
          )
          assert html.count('class="eoc-country-capacity-item"') >= 15, (
              'The expanded country statuses must be embedded in each row'
          )
          assert not any(x.key == 'capacity_country_view' for x in app.selectbox), (
              'The old country capacity selector must be removed'
          )
          section = next(x for x in app.segmented_control if x.key == 'regional_section')
          section.set_value('Operations & hazards').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          section = next(x for x in app.segmented_control if x.key == 'regional_section')
          assert section.value == 'Operations & hazards'
          nav = next(x for x in app.radio if x.key == 'main_view')
          nav.set_value('Country profiles').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          assert all(x.value != 'Methods & data' for x in app.radio)
          print('English default, Spanish charts, and country view: PASS')
          PYTEST