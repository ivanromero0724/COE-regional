name: Validate Streamlit COE dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'dashboard/**'
      - 'data/**'
      - 'logos/**'
      - '.streamlit/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/dashboard-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coe-dashboard-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install application requirements
        run: pip install -r requirements.txt
      - name: Check syntax, survey and cartographic layer
        run: |
          python -m py_compile app.py dashboard/data.py dashboard/charts.py
          python -m pytest -q tests/test_dashboard_data.py tests/test_dashboard_layout.py
      - name: Smoke-test Streamlit application
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          main_nav = [x for x in app.radio if x.label == 'Explore']
          assert main_nav and 'Methods & data' not in main_nav[0].options
          main_nav[0].set_value('Country profiles').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          print('Regional and country pages load; methods page absent')
          PY