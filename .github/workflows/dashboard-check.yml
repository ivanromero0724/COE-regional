name: Validate Streamlit COE dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'dashboard/**'
      - 'data/**'
      - 'logos/**'
      - '.streamlit/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/dashboard-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coe-dashboard-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install application requirements
        run: pip install -r requirements.txt
      - name: Check syntax, survey and cartographic layer
        run: |
          python -m py_compile app.py dashboard/data.py dashboard/charts.py dashboard/i18n.py dashboard/treemap.py
          python -m pytest -q tests/test_dashboard_data.py tests/test_dashboard_layout.py tests/test_dashboard_i18n.py tests/test_dashboard_map.py tests/test_dashboard_alignment.py tests/test_dashboard_drilldowns.py tests/test_dashboard_network_heatmap.py tests/test_dashboard_treemaps.py
      - name: Smoke-test bilingual pages and regional charts
        run: |
          python - <<'PYTEST'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file('app.py').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          locale = next(x for x in app.radio if x.key == 'coe_language')
          assert locale.value == 'en', 'English must be the initial language'
          assert not any(x.key == 'geo_area' for x in app.selectbox)
          assert not any(x.key == 'country_filter' for x in app.multiselect)

          # Check regional charts in Spanish, then country view in Spanish.
          locale.set_value('es').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          section = next(x for x in app.segmented_control if x.key == 'regional_section')
          assert section.value == 'Overview', 'Regional overview must be initially selected'
          assert not any(x.key == 'regional_section' for x in app.sidebar.radio)
          assert any('eoc-country-category-item' in x.value for x in app.markdown), (
              'Operating and activation bars should open matching countries'
          )
          treemaps=[x.value for x in app.markdown if 'class="eoc-overview-treemap-card"' in x.value]
          assert len(treemaps)==2, 'Overview should show the two regional treemaps'
          assert sum(x.count('class="eoc-overview-treemap-tile"') for x in treemaps)==12, (
              'Overview should include seven reported capacities and five priority gaps'
          )
          assert all('eoc-country-capacity-item' not in x for x in treemaps), (
              'Overview must summarize regional percentages without country drilldowns'
          )
          assert all('eoc-overview-treemap-caption' not in x for x in treemaps), (
              'The two treemap captions must be removed'
          )
          assert any('Países donde cada capacidad aún no está plenamente establecida.' in x.value
                     for x in app.markdown), (
              'The Spanish overview gaps description should be easy to understand'
          )
          section.set_value('Capacities & gaps').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          assert any('class="section-title">Capacidades y brechas</div>' in x.value
                     for x in app.markdown), (
              'The capacity section should have one clear heading'
          )
          assert not any('Capacidades y brechas por indicador' in x.value
                         or 'Country counts reflect only recognized answers' in x.value
                         for x in app.markdown), (
              'Redundant capacity headings and explanatory subtitle must not appear'
          )
          assert any(x.key == 'capacity_component' for x in app.selectbox), (
              'The component selector should remain usable'
          )
          assert not any('Capacity availability' in x.value or 'Disponibilidad de capacidades' in x.value
                         for x in app.markdown), (
              'The redundant regional capacity availability section must not be shown'
          )
          assert not any('Information systems and surge workforce' in x.value
                         or 'Sistemas de información y personal de refuerzo' in x.value
                         for x in app.markdown), 'Duplicated capacities must not appear'
          assert not any(x.key == 'capacity_country_view' for x in app.selectbox), (
              'The old country capacity selector must be removed'
          )
          section = next(x for x in app.segmented_control if x.key == 'regional_section')
          section.set_value('Hazards & training').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          assert any('eoc-hazard-grid' in x.value for x in app.markdown), (
              'Four hazard donut cards should precede the country heatmap'
          )
          assert not any('eoc-training-bars' in x.value for x in app.markdown), (
              'Training must render as a single chart, not expandable country rows'
          )
          assert not any('Physical infrastructure' in x.value
                         or 'Infraestructura física' in x.value for x in app.markdown), (
              'Physical infrastructure must only be explored under Capacities & gaps'
          )
          assert any('02 / DESARROLLO DEL PERSONAL' in x.value
                     for x in app.markdown), (
              'Training should be the second regional operations section'
          )
          section = next(x for x in app.segmented_control if x.key == 'regional_section')
          assert section.value == 'Hazards & training'
          section.set_value('GHEC').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          assert any('<div class="network-card">' in x.value for x in app.markdown), (
              'Static network summary cards are missing'
          )
          assert not any('<details class="network-card">' in x.value for x in app.markdown), (
              'Old network card disclosures must be removed'
          )
          assert any('eoc-network-legend' in x.value for x in app.markdown), (
              'Network status heatmap must show a bilingual legend'
          )
          assert any('Participación de los países por red' in x.value for x in app.markdown), (
              'Country/network heatmap title must render in Spanish'
          )
          heatmaps=[x.value for x in app.markdown if 'class="eoc-network-matrix"' in x.value]
          assert len(heatmaps)==1, 'A full-width HTML heatmap must render without Plotly'
          assert heatmaps[0].count('class="eoc-network-country"')==15, (
              'Heatmap must include all fifteen country responses'
          )
          assert heatmaps[0].count('class="eoc-network-heat-cell"')==45, (
              'Heatmap must have three network cells per country'
          )
          assert heatmaps[0].count('class="eoc-network-heat-symbol"')==45, (
              'Matrix should display one colored icon per country/network, not filled labels'
          )
          assert any(x.value.count('class="eoc-network-legend-symbol"')==4
                     for x in app.markdown), 'Legend must display the same four status icons'
          coop_treemaps=[x.value for x in app.markdown
                         if 'eoc-cooperation-treemap-card' in x.value]
          assert len(coop_treemaps)==2, (
              'Cooperation expertise and modalities should render as two treemaps'
          )
          assert sum(x.count('class="eoc-overview-treemap-tile eoc-cooperation-tile"')
                     for x in coop_treemaps)==16, (
              'Treemaps should cover nine leading expertise areas and all seven modalities'
          )
          assert not any('The cooperation and network questions were completed' in x.value
                         or 'Las preguntas de cooperación y redes tienen menos respuestas' in x.value
                         for x in app.markdown), (
              'Redundant cooperation response note should be removed'
          )
          nav = next(x for x in app.radio if x.key == 'main_view')
          nav.set_value('Country profiles').run(timeout=90)
          assert not app.exception, [e.message for e in app.exception]
          assert all(x.value != 'Methods & data' for x in app.radio)
          print('English default, Spanish charts, and country view: PASS')
          PYTEST