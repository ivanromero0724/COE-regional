name: Build EOC country fact sheets

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'logos/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/fact-sheets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eoc-country-fact-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-pdf:
    name: Generate and publish PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install fonts for PDF typography and country flags
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-color-emoji
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate consolidated and country PDFs
        run: python scripts/generate_country_profiles.py
      - name: Validate page counts and structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from scripts.generate_country_profiles import read_first_sheet, COUNTRIES, HERE, val
          rows = read_first_sheet(HERE / 'data' / 'Encuesta_OPS_2026_COEs.xlsx')
          expected = sum(bool(val(r,7)) for r in rows[1:])
          combined = Path('output/PAHO_EOC_Country_Fact_Sheets_2026.pdf')
          singles = sorted(Path('output/countries').glob('*.pdf'))
          assert len(PdfReader(str(combined)).pages) == expected
          assert len(singles) == expected
          assert all(len(PdfReader(str(path)).pages) == 1 for path in singles)
          full = PdfReader(str(combined))
          # Each page embeds precisely the tracked two logos and a country flag.
          assert all(len(page.images) >= 3 for page in full.pages), 'Missing logo or country flag'
          names = [p.name for p in singles]
          assert 'colombia_ministry_of_health.pdf' in names
          assert 'colombia_national_institute_of_health.pdf' in names
          assert len({p.name for p in singles}) == expected
          print(f'OK: {expected} independent response sheets and embedded country flags')
          PY
      - name: Publish PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAHO-EOC-Country-Fact-Sheets-2026
          path: output/**/*.pdf
          retention-days: 90
          if-no-files-found: error
      - name: Commit generated PDFs to the repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          if git diff --cached --quiet; then
            echo 'No PDF changes to publish.'
          else
            git commit -m 'docs: refresh EOC country fact sheets [skip ci]'
            # A README or survey edit may land while PDFs are being generated.
            # Rebase generated outputs on the current remote branch before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt conflicted; retrying against current main."
            done
            exit 1
          fi